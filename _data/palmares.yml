# name   : nom de la compétition (affiché en gros)
# rank   : classement (rank_en : version anglaise, facultatif)
# meta   : sous-titre (meta_en : version anglaise, facultatif)
# membres : pseudos affichés en @nom (mêmes noms que le champ « name » des fiches _members/)
# logos  : organisations participantes. img = fichier dans assets/img/logos/
#          (images externes bloquées par la CSP). img vide = emplacement avec l'initiale du nom.
#          url = lien ouvert au clic sur le logo (facultatif).
# writeup : bouton affiché automatiquement si assets/writeups/<nom-slugifié>.pdf existe
#           (ex. « DeepThreats 2026 » -> deepthreats-2026.pdf). Champ facultatif pour
#           forcer un autre fichier de assets/writeups/ ou un lien https://.
