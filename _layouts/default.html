<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self'; form-action https://formspree.io; base-uri 'self'; object-src 'none'; frame-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>{% if page.name %}{{ page.name | escape }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<div class="bg-logo" aria-hidden="true"></div>
<header class="nav">
  <a class="brand" href="{{ '/#accueil' | relative_url }}">
    <span class="crow" aria-hidden="true">
      <span class="eye"></span>
    </span>CORVUS MIND</a>
  <nav>
    <a href="{{ '/#palmares' | relative_url }}">Palmarès</a>
    <a href="{{ '/#membres' | relative_url }}">Membres</a>
    <a href="{{ '/#contact' | relative_url }}">Contact</a>
  </nav>
</header>
<main>{{ content }}</main>
<footer><a href="{{ '/#accueil' | relative_url }}">CORVUS MIND</a><span>OSINT</span><a href="{{ '/#accueil' | relative_url }}">Retour en haut</a></footer>
</body>
</html>
