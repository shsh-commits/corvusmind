title: "Corvus Mind"
tagline: "Équipe de renseignement en sources ouvertes"
description: "Corvus Mind, équipe OSINT francophone : investigations en sources ouvertes, géolocalisation, SOCMINT et compétitions CTF OSINT."
lang: fr
locale: fr_FR
logo: /assets/img/favicon.png      # logo pour Google (résultats de recherche)
image: /assets/img/logo.png       # aperçu lors d'un partage (LinkedIn, Discord…)
baseurl: "/corvusmind"  # "/nom-du-repo" si le site n'est pas à la racine
url: "https://shsh-commits.github.io"
# Formspree : créer un formulaire sur formspree.io et coller l'ID ici
formspree_id: "mqpeppjq"
# Dépôt GitHub « utilisateur/nom-du-repo » : active le lien « Modifier mon profil »
repository: ""
branch: main
exclude: [README.md, LICENSE, .github]

# Référencement : génère sitemap.xml (extension prise en charge par GitHub Pages)
plugins:
  - jekyll-sitemap
# Google Search Console : coller ici le code de vérification (balise meta)
google_site_verification: "lBxaTovVbR49ICGBTmK1BDMAlVlK-Pg6EQn_Da65kps"

# News / writeups : un fichier par article dans _posts/ (AAAA-MM-JJ-titre.md)
permalink: /news/:year/:title/
defaults:
  - scope: {type: posts}
    values: {layout: post}

# Pages individuelles des membres (une fiche = un fichier dans _members/)
collections:
  members:
    output: true
    permalink: /membres/:name/
